<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta
name="viewport"
content="
width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no
">
<title>Hasil</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<!-- HEADER -->
<div class="header-box">

    <div class="logo-box">
        <img src="icon.png">
    </div>

    <div class="school-text">

        <a href="aboutme.html"
        class="about-btn">

            Tentang Kami

        </a>

        <h1>SDN 1 TADIKA MESRA</h1>

        <p>
            Jalan Kampung Durian Runtuh 4,
            blok D nomor 7
        </p>

    </div>

</div>

    <!-- HASIL -->
    <div class="hasil-box">

        <div class="foto-box">

            <img id="hasilFoto">

        </div>

        <div class="inner-card">

            <div class="hasil-item">

                <h3>Nama :</h3>

                <p id="hasilNama"></p>

            </div>

            <div class="hasil-item">

                <h3>
                    Tanggal Lahir (HH/BB/TTTT) :
                </h3>

                <p id="hasilTanggal"></p>

            </div>
            
            <!-- TAMBAHIN setelah hasilTanggal -->

<div class="hasil-item">

    <h3>
        Jenis Kelamin :
    </h3>

    <p id="hasilGender"></p>

</div>

            <div class="hasil-item">

                <h3>Nama Ayah :</h3>

                <p id="hasilAyah"></p>

            </div>

            <div class="hasil-item">

                <h3>Nama Ibu :</h3>

                <p id="hasilIbu"></p>

            </div>

            <div class="hasil-item">

                <h3>Alamat :</h3>

                <p id="hasilAlamat"></p>

            </div>

            <div class="hasil-item">

                <h3>Asal Sekolah :</h3>

                <p id="hasilSekolah"></p>

            </div>

            <div class="hasil-item">

                <h3>
                    Ekstrakulikuler yang ingin diikuti :
                </h3>

                <p id="hasilEkskul"></p>

            </div>

        </div>

    </div>

    <!-- BUTTON -->
    <div class="bottom-btn">

        <button
class="edit-btn"
onclick="
window.location.href=
'pendaftaran.html'
">

    Ragu?
    <br>
    Klik ini untuk mengedit

</button>

        <button class="send-btn">

            Kirimkan Data

        </button>

    </div>

</div>

<script>

const data =
JSON.parse(
localStorage.getItem("dataSiswa")
);

/* CEK DATA */
if(!data){

    alert(
    "Data tidak ditemukan!"
    );

    window.location.href =
    "pendaftaran.html";

}

/* FOTO */
document.getElementById("hasilFoto")
.src = data.foto || "";

/* DATA */
document.getElementById("hasilNama")
.innerText = data.nama || "-";

document.getElementById("hasilTanggal")
.innerText = data.tanggal || "-";

document.getElementById("hasilGender")
.innerText = data.gender || "-";

document.getElementById("hasilAyah")
.innerText = data.ayah || "-";

document.getElementById("hasilIbu")
.innerText = data.ibu || "-";

document.getElementById("hasilAlamat")
.innerText = data.alamat || "-";

document.getElementById("hasilSekolah")
.innerText = data.sekolah || "-";

document.getElementById("hasilEkskul")
.innerText = data.ekskul || "-";

</script>

</body>
</html>
