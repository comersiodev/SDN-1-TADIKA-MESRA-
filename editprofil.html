<!-- editprofil.html -->
<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="
width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no
">

<title>Edit Profil</title>

<link
rel="stylesheet"
href="style.css">

</head>
<body>

<div class="container">

    <!-- HEADER -->
    <div class="header-box">

        <div class="logo-box">

            <img src="icon.png">

        </div>

        <div class="school-text">

            <h1>
                SDN 1 TADIKA MESRA
            </h1>

            <p>
                Jalan Kampung Durian Runtuh 4,
                blok D nomor 7
            </p>

        </div>

    </div>

    <!-- BOX -->
    <div class="form-box">

        <h2 class="data-title">

            EDIT PROFIL

        </h2>

        <!-- FOTO -->
        <div class="profile-wrapper">

            <div class="profile-box">

                <img
                id="previewFoto"
                src="default.png">

            </div>

            <label
            class="upload-profile-btn">

                Upload Picture

                <input
                type="file"
                id="fotoInput"
                accept="image/*"
                hidden>

            </label>

        </div>

        <!-- NAMA -->
        <div class="input-area">

            <label>
                Nama :
            </label>

            <input
            type="text"
            id="nama">

        </div>

        <!-- USIA -->
        <div class="input-area">

            <label>
                Usia :
            </label>

            <input
            type="number"
            id="usia">

        </div>

        <!-- TANGGAL -->
        <div class="input-area">

            <label>
                Tanggal Lahir :
            </label>

            <input
            type="date"
            id="tanggal">

        </div>

        <!-- KELAS -->
        <div class="input-area">

            <label>
                Kelas saat ini :
            </label>

            <input
            type="text"
            id="kelas">

        </div>

        <!-- PELAJARAN -->
        <div class="input-area">

            <label>
                Pelajaran Favorit :
            </label>

            <input
            type="text"
            id="pelajaran">

        </div>

        <!-- HOBI -->
        <div class="input-area">

            <label>
                Hobi :
            </label>

            <input
            type="text"
            id="hobi">

        </div>

        <!-- EKSKUL -->
        <div class="input-area">

            <label>
                Ekstrakulikuler :
            </label>

            <input
            type="text"
            id="ekskul">

        </div>

        <!-- TAHUN -->
        <div class="input-area">

            <label>
                Masuk Tahun ajaran :
            </label>

            <input
            type="text"
            id="tahun">

        </div>

        <!-- BIODATA -->
        <div class="input-area">

            <label>
                Biodata :
            </label>

            <textarea
            id="desc"
            rows="6"
            placeholder="
Pisahkan tiap biodata dengan ENTER
            "></textarea>

        </div>

    </div>

    <!-- BUTTON -->
    <div class="bottom-btn">

        <button
        class="edit-btn"
        onclick="
        history.back()
        ">

            Batal

        </button>

        <button
        class="send-btn"
        id="saveBtn">

            Simpan

        </button>

    </div>

</div>

<script>

/* AMBIL DATA */
let profileData =
JSON.parse(
localStorage.getItem(
"profileData"
)) || {};

/* ISI DATA */
document
.getElementById("nama")
.value =
profileData.nama || "";

document
.getElementById("usia")
.value =
profileData.usia || "";

document
.getElementById("tanggal")
.value =
profileData.tanggal || "";

document
.getElementById("kelas")
.value =
profileData.kelas || "";

document
.getElementById("pelajaran")
.value =
profileData.pelajaran || "";

document
.getElementById("hobi")
.value =
profileData.hobi || "";

document
.getElementById("ekskul")
.value =
profileData.ekskul || "";

document
.getElementById("tahun")
.value =
profileData.tahun || "";

/* FOTO */
if(profileData.foto){

    document
    .getElementById(
    "previewFoto"
    )
    .src =
    profileData.foto;

}

/* BIODATA */
if(profileData.desc){

    document
    .getElementById(
    "desc"
    )
    .value =
    profileData.desc.join("\n");

}

/* FOTO PREVIEW */
document
.getElementById(
"fotoInput"
)
.addEventListener(
"change",
function(){

    const file =
    this.files[0];

    if(file){

        const reader =
        new FileReader();

        reader.onload =
        function(e){

            document
            .getElementById(
            "previewFoto"
            )
            .src =
            e.target.result;

            profileData.foto =
            e.target.result;

        };

        reader.readAsDataURL(
        file
        );

    }

});

/* SIMPAN */
document
.getElementById(
"saveBtn"
)
.addEventListener(
"click",
function(){

    profileData.nama =
    document
    .getElementById(
    "nama"
    )
    .value;

    profileData.usia =
    document
    .getElementById(
    "usia"
    )
    .value;

    profileData.tanggal =
    document
    .getElementById(
    "tanggal"
    )
    .value;

    profileData.kelas =
    document
    .getElementById(
    "kelas"
    )
    .value;

    profileData.pelajaran =
    document
    .getElementById(
    "pelajaran"
    )
    .value;

    profileData.hobi =
    document
    .getElementById(
    "hobi"
    )
    .value;

    profileData.ekskul =
    document
    .getElementById(
    "ekskul"
    )
    .value;

    profileData.tahun =
    document
    .getElementById(
    "tahun"
    )
    .value;

    profileData.desc =
    document
    .getElementById(
    "desc"
    )
    .value
    .split("\n");

    localStorage.setItem(

    "profileData",

    JSON.stringify(
    profileData
    )

    );

    alert(
    "Profil berhasil disimpan!"
    );

    window.location.href =
    "datadiri.html";

});

</script>

</body>
</html>
